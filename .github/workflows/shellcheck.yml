name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis de Bash
        run: bash -n GestorSistema.sh
      - name: ShellCheck
        run: shellcheck --severity=error GestorSistema.sh
